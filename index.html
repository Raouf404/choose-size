<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Choose size</title>
    <script src="./script.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
  </head>
  <body>
    <!-- Code before -->
    <section>
      <div class="select">
        <h2>Get your favorites for free</h2>
        <div class="list-container">
          <ul>
            <li>
              <button id="offer-25">25<span class="star">*</span></button>
              <div class="underline"></div>
            </li>
            <li>
              <button id="offer-100">100<span class="star">*</span></button>
              <div class="underline"></div>
            </li>
            <li>
              <button id="offer-200">200<span class="star">*</span></button>
              <div class="underline"></div>
            </li>
            <li>
              <button id="offer-300">300<span class="star">*</span></button>
              <div class="underline"></div>
            </li>
            <li>
              <button id="offer-400">400<span class="star">*</span></button>
              <div class="underline"></div>
            </li>
          </ul>
        </div>
      </div>
      <div class="content">
        <div class="offer-image">
          <img id="content-image" class="fade-in" />
        </div>
        <div class="offer-text">
          <h3 id="content-title" class="fade-in"></h3>
          <p id="content-text" class="fade-in"></p>
        </div>
      </div>
    </section>
    <!-- Code after -->
  </body>
</html>
